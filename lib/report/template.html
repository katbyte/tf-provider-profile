<style>

<body>
<header>
  <h1>tfpp <span>·</span> <select id="prov" title="provider"></select></h1>
  <div class="sub" id="subtitle"></div>
</header>
<div class="layout">
  <aside>
    <input type="search" id="search" placeholder="filter metrics…" autocomplete="off">
    <div class="actions"><button class="plain" id="clear">clear</button><button class="plain" id="defaults">defaults</button></div>
    <div id="groups"></div>
  </aside>
  <div class="splitter" id="splitter" title="drag to resize"></div>
  <main>
    <div class="controls">
      <span>view</span>
      <span class="seg" data-key="view"><button data-v="panels">panels</button><button data-v="unit">one chart per unit</button><button data-v="twoaxes">two axes</button><button data-v="pct">% change</button><button data-v="delta">per-release change</button></span>
      <span>grid</span>
      <select id="cols"><option value="0">auto</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select>
      <span>x</span>
      <span class="seg" data-key="x"><button data-v="date">date</button><button data-v="release">release</button></span>
      <span>range</span>
      <select id="rangeA"></select><span>→</span><select id="rangeB"></select>
      <span>y</span>
      <span class="seg" data-key="zero"><button data-v="0">fit</button><button data-v="1">from zero</button></span>
      <span>dots</span>
      <span class="seg" data-key="dots"><button data-v="auto">auto</button><button data-v="1">on</button><button data-v="0">off</button></span>
      <span class="seg" data-key="table"><button data-v="0">charts</button><button data-v="1">table</button></span>
    </div>
    <div class="controls"><span>markers</span><span class="seg multi" id="markers"></span>
      <span>tooltip</span><span class="seg" data-key="tip"><button data-v="current">current</button><button data-v="all">all</button></span></div>
    <div id="charts"></div>
    <div id="tableview"></div>
    <details style="margin-top:28px"><summary>Compare two releases · every metric side by side</summary>
      <div class="controls" style="margin-top:8px"><span>from</span> <select id="cmpA"></select> <span>to</span> <select id="cmpB"></select></div>
      <div class="scroll" id="compare"></div>
    </details>
    <details style="margin-top:12px"><summary>Release and stage status</summary><div class="scroll" id="status"></div></details>
  </main>
</div>
<div id="tip"></div>
<div id="ctx" hidden><div class="v"></div><table class="sum"></table><div class="row"></div><textarea readonly></textarea></div>
<script id="data" type="application/json">/*__TFPP_DATA__*/</script>
<script>
(() => {
const RAW = JSON.parse(document.getElementById('data').textContent).providers;
const SLOTS = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const css = v => `var(${v})`;
const $ = s => document.querySelector(s);

// ---------- merged dataset: every provider's releases on one timeline; metric keys are "<provider>:<key>" ----------
const PROVIDERS = RAW.map(p => p.provider);
const provOf = k => k.slice(0, k.indexOf(':'));
const bare = k => k.slice(k.indexOf(':') + 1);
const isComp = k => bare(k).startsWith('comp.');
const COMP_KINDS = [
  ['modules', 'Text by module', 'top 7 modules by peak attributed text size, rest folded into other'],
  ['services', 'Text by provider service', 'internal/services/<service> packages only'],
  ['sections', 'Sections', 'object-file sections; pclntab is the runtime function table, rodata holds type data and strings'],
  ['movers', 'Biggest movers', 'modules by change in attributed text size across the selected range'],
];
const RELEASES = RAW.flatMap(p => p.releases.map(r => ({ ...r, provider: p.provider, id: p.provider + '@' + r.version })))
  .sort((a, b) => a.ts - b.ts || a.provider.localeCompare(b.provider));
const ROW = {};
RELEASES.forEach((r, i) => { ROW[r.id] = i; });
const remap = (p, vals) => { const out = new Array(RELEASES.length).fill(null); p.releases.forEach((r, i) => { out[ROW[p.provider + '@' + r.version]] = vals[i] ?? null; }); return out; };
const METRICS = RAW.flatMap(p => p.metrics.map(m => ({ ...m, key: `${p.provider}:${m.key}`, provider: p.provider, group: `${p.provider}/${m.group}`, values: remap(p, m.values) })));
const GROUPS = RAW.flatMap(p => [...p.groups, { id: 'compchart', label: 'Composition charts' }].map(g => ({ id: `${p.provider}/${g.id}`, label: g.label, provider: p.provider })));
const COMPS = RAW.flatMap(p => p.platforms.flatMap(pl => COMP_KINDS.map(([kind, label, desc]) => ({ key: `${p.provider}:comp.${pl}.${kind}`, label: `${label} (${pl})`, unit: 'comp', group: `${p.provider}/compchart`, desc, values: [], up_is: 'neutral', provider: p.provider, plat: pl, kind }))));
const CATALOGUE = [...METRICS, ...COMPS];
const COMPOSITION = {};
for (const p of RAW) for (const [pl, c] of Object.entries(p.composition)) COMPOSITION[`${p.provider}:${pl}`] = Object.fromEntries(Object.entries(c).map(([k, v]) => [k, { names: v.names, rows: remap(p, v.rows).map(r => r || v.names.map(() => null)) }]));
const PLATFORMS = Object.fromEntries(RAW.map(p => [p.provider, p.platforms]));
const platFor = p => (PLATFORMS[p] || []).includes('linux_amd64') ? 'linux_amd64' : ((PLATFORMS[p] || [])[0] || '');
const META = Object.fromEntries(RAW.map(p => [p.provider, { repo: p.repo, generated: p.generated, tool: p.tool }]));
const visible = () => state.p === 'all' ? PROVIDERS : [state.p];
const multi = () => state.p === 'all' && PROVIDERS.length > 1;
const lbl = m => multi() ? `${m.label} · ${m.provider}` : m.label;
// expand bare preset keys ("binary.{plat}.zip_bytes") for every visible provider
const expand = keys => visible().flatMap(prov => keys.map(k => `${prov}:${k.replace('{plat}', platFor(prov))}`)).filter(k => M[k]);

// R/N/M/COMP/VIS are the release window currently shown; applyRange() re-derives them from the merged dataset
let R, N, M, COMP, VIS;
function applyRange() {
  const vis = visible();
  VIS = RELEASES.map((r, i) => [r, i]).filter(([r]) => vis.includes(r.provider));
  const at = v => VIS.findIndex(([r]) => r.id === v || (vis.length === 1 && r.version === v));
  let i0 = at(state.from), i1 = at(state.to);
  if (i0 < 0) i0 = 0;
  if (i1 < 0) i1 = VIS.length - 1;
  if (i0 > i1) [i0, i1] = [i1, i0];
  const win = VIS.slice(i0, i1 + 1), idx = win.map(([, i]) => i);
  R = win.map(([r]) => r); N = R.length;
  M = {};
  for (const m of CATALOGUE) if (vis.includes(m.provider)) M[m.key] = m.unit === 'comp' ? m : { ...m, values: idx.map(i => m.values[i]) };
  COMP = {};
  for (const [k, c] of Object.entries(COMPOSITION)) if (vis.includes(provOf(k))) COMP[k] = Object.fromEntries(Object.entries(c).map(([kind, v]) => [kind, { names: v.names, rows: idx.map(i => v.rows[i]) }]));
}

// ---------- state (persisted in the url hash) ----------
// panels are groups of metric keys; a group with several keys is one combined chart
const DEFAULT_GROUPS = () => visible().flatMap(prov => {
  const k = x => `${prov}:${x.replace('{plat}', platFor(prov))}`;
  return [
    { keys: ['schema.resources', 'schema.data_sources', 'schema.ephemeral_resources', 'schema.list_resources', 'schema.actions', 'schema.functions'], stack: true },
    { keys: ['schema.list_coverage_pct', 'schema.identity_coverage_pct'] },
    { keys: ['source.typed_pct', 'source.typed_resource_pct', 'source.typed_data_source_pct'] },
    { keys: ['source.sdk_pct.go_azure_sdk', 'source.sdk_pct.both', 'source.sdk_pct.kermit', 'source.sdk_pct.track1'], stack: true },
    { keys: ['source.go_code_lines', 'source.go_test_lines', 'source.vendor_go_lines'], stack: true },
    { keys: ['binary.{plat}.zip_bytes', 'binary.{plat}.binary_bytes'] },
    { keys: ['schema.provider_max_rss_bytes', 'startup.max_rss_bytes'] },
    { keys: ['source.typed_resources', 'source.untyped_resources', 'source.typed_data_sources', 'source.untyped_data_sources'], stack: true },
  ].map(g => ({ keys: g.keys.map(k).filter(x => M[x]), stack: !!g.stack, wide: false })).filter(g => g.keys.length);
});
const state = { groups: [], sel: [], right: [], view: 'panels', x: 'date', zero: '0', table: '0', colors: {}, from: '', to: '', cols: '2', dots: 'auto', mk: ['releases', 'majors'], tip: 'current', p: PROVIDERS.includes('__TFPP_PROVIDER__') ? '__TFPP_PROVIDER__' : (PROVIDERS.length > 1 ? 'all' : (PROVIDERS[0] || '')) };
applyRange();
function syncSel() { state.groups = state.groups.filter(g => g.keys.length); state.sel = state.groups.flatMap(g => g.keys); assignColors(); }
// groups restricted to what the current provider selection can show; gi keeps the index into state.groups
const visibleGroups = () => state.groups.map((g, gi) => ({ ...g, gi, keys: g.keys.filter(k => M[k]) })).filter(g => g.keys.length);
const vsel = () => state.sel.filter(k => M[k]);
function parseGroups(str) {
  return str.split('|').filter(Boolean).map(part => {
    const m = part.match(/^([sw]+):(.*)$/);
    const flags = m ? m[1] : '', body = m ? m[2] : part;
    return { keys: body.split(',').filter(k => CATALOGUE.some(c => c.key === k)), stack: flags.includes('s'), wide: flags.includes('w') };
  }).filter(g => g.keys.length);
}

// ---------- composition (stacked areas) ----------
function stackedArea(el, comp, opts) {
  const top = opts.top || 7;
  const names = comp.names.slice(0, top);
  const rows = comp.rows.map(row => {
    const vals = names.map((_, j) => row[j]);
    let other = 0, any = false;
    for (let j = top; j < row.length; j++) if (row[j] != null) { other += row[j]; any = true; }
    if (row.slice(0, top).some(v => v != null)) vals.push(any || comp.names.length > top ? other : 0); else vals.push(null);
    return vals;
  });
  const labels = [...names, comp.names.length > top ? 'other (' + (comp.names.length - top) + ')' : null].filter(Boolean);
  const colors = labels.map((_, j) => j < names.length ? css(SLOTS[j % SLOTS.length]) : 'var(--other)');
  const w = Math.max(320, Math.round(el.getBoundingClientRect().width) || 600), h = 260, pad = { l: 52, r: 14, t: 10, b: 24 };
  const xs = xScale(w, pad);

  const hi = Math.max(...totals.filter(v => v != null), 1) * 1.05;

  for (const t of xs.ticks) g += `<text x="${t.x}" y="${h - 6}" text-anchor="middle">${t.label}</text>`;
  const idx = rows.map((r, i) => r.some(v => v != null) ? i : -1).filter(i => i >= 0);
  const cum = idx.map(() => 0);
  const series = labels.map((lbl, j) => ({ label: lbl, color: colors[j], values: rows.map(r => r[j]) }));
  labels.forEach((lbl, j) => {
    const topPts = [], botPts = [];
    idx.forEach((i, k) => { const b = cum[k], t = b + (rows[i][j] || 0); botPts.push([xs.at(i), ys(b)]); topPts.push([xs.at(i), ys(t)]); cum[k] = t; });
    const d = topPts.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ') + ' ' + botPts.slice().reverse().map(p => 'L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ') + ' Z';

  });
  g += `<line class="axis" x1="${pad.l}" x2="${w - pad.r}" y1="${h - pad.b}" y2="${h - pad.b}"/>`;
  g += majorMarks(xs, pad, h, opts.keys || []);
  g += `<line class="cross" x1="0" x2="0" y1="${pad.t}" y2="${h - pad.b}"/>`;
  g += `<rect class="hit" x="${pad.l}" y="0" width="${w - pad.l - pad.r}" height="${h}"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${g}</svg><div class="legend">${labels.map((l, j) => `<span><i class="box" style="background:${colors[j]}"></i>${l}</span>`).join('')}</div>`;
  const svg = el.firstChild;
  const c = { svg, xs, w, h, pad, scaleOf: () => ys, series, cross: svg.querySelector('.cross'), dots: [], unit: 'bytes', own: true, totals, keys: opts.keys || [] };
  charts.push(c); attachCtx(c);
  svg.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect();
    const x = (ev.clientX - r.left) / r.width * w;
    let best = 0, bd = Infinity;
    for (let i = 0; i < N; i++) { const d = Math.abs(xs.at(i) - x); if (d < bd) { bd = d; best = i; } }
    const saved = tipRows;
    tipRows = i => `<tr><td>total</td><td class="n">${fmt(totals[i], 'bytes')}</td><td class="d">${i > 0 && totals[i - 1] != null && totals[i] != null ? fmtDelta(totals[i - 1], totals[i], 'bytes').text : ''}</td></tr>` + series.map(s => `<tr><td><i style="background:${s.color}"></i>${s.label}</td><td class="n">${fmt(s.values[i], 'bytes')}</td><td class="d">${i > 0 && s.values[i - 1] != null && s.values[i] != null ? fmtDelta(s.values[i - 1], s.values[i], 'bytes').text : ''}</td></tr>`).join('');
    setHover(best, ev, c);
    tipRows = saved;
  });
  svg.addEventListener('mouseleave', () => setHover(-1));
}
function renderComp(el, c) {
  const comp = COMP[`${c.provider}:${c.plat}`];
  if (!comp) { el.innerHTML = '<div class="empty">no binary composition data</div>'; return; }
  if (c.kind !== 'movers') { stackedArea(el, comp[c.kind], { top: c.kind === 'sections' ? 8 : 7, keys: [c.key] }); return; }
  const mv = comp.modules.names.map((n, j) => {
    const col = comp.modules.rows.map(r => r[j]);
    const { f, l } = firstLast(col);
    return { n, f, l, d: (l || 0) - (f || 0) };
  }).filter(x => x.f != null || x.l != null).sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 20);
  const totF = comp.modules.rows.find(r => r.some(v => v != null)), totL = [...comp.modules.rows].reverse().find(r => r.some(v => v != null));
  const sum = r => r ? r.reduce((a, v) => a + (v || 0), 0) : null;
  el.innerHTML = `<div class="scroll"><table class="data"><thead><tr><th>module</th><th></th><th>first (${R[0].version})</th><th>last (${R[N - 1].version})</th><th>change</th></tr></thead><tbody>
    <tr><td><b>all attributed text</b></td><td></td><td>${fmt(sum(totF), 'bytes')}</td><td>${fmt(sum(totL), 'bytes')}</td><td class="${fmtDelta(sum(totF), sum(totL), 'bytes', 'bad').cls}">${fmtDelta(sum(totF), sum(totL), 'bytes').text}</td></tr>
    ${mv.map(x => `<tr><td>${esc(x.n)}</td><td></td><td>${fmt(x.f, 'bytes')}</td><td>${fmt(x.l, 'bytes')}</td><td class="${x.d > 0 ? 'down' : x.d < 0 ? 'up' : ''}">${x.f == null ? 'new' : x.l == null ? 'removed' : fmtDelta(x.f, x.l, 'bytes').text}</td></tr>`).join('')}
  </tbody></table></div><p class="note">growth is coloured red and shrinkage green, since this table is about binary size</p>`;
}

// ---------- compare two releases ----------
function renderCompare() {
  const a = $('#cmpA'), b = $('#cmpB');
  if (a.dataset.p !== state.p) {
    const opts = VIS.map(([r]) => `<option value="${r.id}">${multi() ? r.provider + ' ' : ''}${r.version} · ${r.date}</option>`).join('');
    a.innerHTML = opts; b.innerHTML = opts; a.dataset.p = state.p;
    a.value = VIS[0][0].id; b.value = VIS[VIS.length - 1][0].id;
    a.onchange = b.onchange = renderCompare;
  }
  const ia = ROW[a.value], ib = ROW[b.value];
  let rows = '';
  for (const g of GROUPS.filter(g => visible().includes(g.provider))) {
    const ms = METRICS.filter(m => m.group === g.id && m.values[ia] != null && m.values[ib] != null);
    if (!ms.length) continue;
    rows += `<tr><th colspan="4" style="text-align:left">${multi() ? g.provider + ' · ' : ''}${g.label}</th></tr>`;
    for (const m of ms) {
      const d = fmtDelta(m.values[ia], m.values[ib], m.unit, m.up_is);
      rows += `<tr><td>${esc(m.label)}</td><td>${fmt(m.values[ia], m.unit)}</td><td>${fmt(m.values[ib], m.unit)}</td><td class="${d.cls}">${d.text}</td></tr>`;
    }
  }
  $('#compare').innerHTML = `<table class="data"><thead><tr><th>metric</th><th>${RELEASES[ia].version}</th><th>${RELEASES[ib].version}</th><th>change</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ---------- status ----------
function renderStatus() {
  const stages = ['download','binary','startup','schema','source','build','lint'];
  const esc = t => String(t).replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const cell = v => {
    if (!v) return '<td><span style="color:var(--muted)">–</span></td>';
    if (v === 'ok') return '<td>ok</td>';
    return '<td><span class="stagefail" title="' + esc(v) + '">failed</span></td>';
  };
  let rows = '';
  for (const [r] of VIS) rows += '<tr><td>' + (multi() ? r.provider + ' ' : '') + r.version + '</td><td>' + r.date + '</td><td>' + (r.go_version || '') + '</td><td>' + (r.terraform || '') + '</td>' + stages.map(s => cell(r.stages[s])).join('') + '</tr>';
  $('#status').innerHTML = '<table class="data"><thead><tr><th>release</th><th>date</th><th>go</th><th>terraform</th>' + stages.map(s => '<th>' + s + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table>';
}

function update() {
  applyRange();
  writeHash();
  renderSidebar(); renderControls(); renderCharts(); renderTable(); renderCompare(); renderStatus(); renderSubtitle();
}
readHash();
function renderSubtitle() {
  const rs = VIS.map(([r]) => r);
  const repos = visible().map(p => META[p].repo).join(', ');
  const gen = visible().map(p => META[p].generated.slice(0, 10)).sort().pop();
  $('#subtitle').textContent = `${rs.length} releases · ${rs[0]?.version} (${rs[0]?.date}) → ${rs[rs.length - 1]?.version} (${rs[rs.length - 1]?.date}) · ${repos} · generated ${gen} by ${META[visible()[0]].tool}`;
  document.title = 'tfpp · ' + state.p;
}
update();
addEventListener('hashchange', () => { readHash(); update(); });
// draggable divider between the tree and the charts; width remembered per browser
{
  const sp = $('#splitter'), root = document.documentElement;
  try { const w = +localStorage.getItem('tfpp.side'); if (w >= 180 && w <= 800) root.style.setProperty('--side', w + 'px'); } catch (e) { /* ignore */ }
  sp.addEventListener('mousedown', ev => {
    ev.preventDefault(); sp.classList.add('on'); document.body.classList.add('resizing');
    const move = e => { const w = Math.min(800, Math.max(180, e.clientX)); root.style.setProperty('--side', w + 'px'); };
    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); sp.classList.remove('on'); document.body.classList.remove('resizing'); try { localStorage.setItem('tfpp.side', parseInt(root.style.getPropertyValue('--side'))); } catch (e) { /* ignore */ } renderCharts(); };
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
  });
}
let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { renderCharts(); }, 150); });
})();
</script>
</body>
