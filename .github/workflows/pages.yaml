---
# Profiles new provider releases every week and publishes reports/ to GitHub Pages.
#
# The providers come from the providers list in .tfpp.yml. The collected data lives in data/<provider>/*.json on the
# default branch, so each run only profiles releases that have no results yet, downloads only those releases' zips,
# commits the new json files back, and deploys the rendered reports/ as the Pages artifact. Enable Pages with "Source: GitHub Actions" in the repository settings.
#
# Timing stages (startup, schema) run on shared runners, so treat their absolute numbers as noisier than a local run;
# trends across releases measured on the same runner type are still meaningful.
name: Pages
on:
  schedule:
    # friday after the usual thursday provider release: 07:00 pacific in summer, 06:00 in winter. github routinely
    # delivers scheduled runs hours late, so the hour is deliberately not pinned any tighter than this
    - cron: '0 14 * * 5'
  workflow_dispatch:
    inputs:
      provider:
        description: provider short name, or "all" for every provider listed in .tfpp.yml
        default: all
      since:
        description: profile releases published on or after (YYYY-MM-DD)
        default: '2024-07-01'
      stages:
        description: stages to run
        default: download,binary,startup,schema,source
      force:
        description: rerun completed stages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the captured profile data
      pages: write # publish the site
      id-token: write # deploy-pages uses OIDC
    env:
      PROVIDER: ${{ inputs.provider || 'all' }}
      SINCE: ${{ inputs.since || '2024-07-01' }}
      STAGES: ${{ inputs.stages || 'download,binary,startup,schema,source' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # make build stamps the version from git describe --tags, which needs the tag history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./.go-version
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: make build

      - name: Profile new releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$PROVIDER" = all ]; then PROVIDER=""; fi
          ./tfpp run --provider "$PROVIDER" --since "$SINCE" --stages "$STAGES" --platforms linux_amd64 \
            ${{ inputs.force && '--force' || '' }}
          touch reports/.nojekyll

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -q -m "data: profile $(date -u +%Y-%m-%d)"
            git push -q
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: reports
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
